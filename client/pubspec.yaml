name: client
description: "AI Job Search — мобильное приложение"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.3
  provider: ^6.1.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  flutter_sound: ^9.30.0
  path_provider: ^2.1.5
  http_parser: ^4.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  open_filex: ^4.7.0
  cached_network_image: ^3.4.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.1
  permission_handler: ^11.3.0
  socket_io_client: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
